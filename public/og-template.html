<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Crown Fried Chicken — OG Share</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: #050505;
      color: #ffffff;
      font-family: 'Anton', 'Arial Black', sans-serif;
      position: relative;
    }

    /* Red brush stroke behind the label */
    .brush {
      position: absolute;
      top: 78px;
      left: 80px;
      width: 380px;
      height: 56px;
      background: #C90012;
      -webkit-mask-image: url('/brush-stroke-wide.svg');
      mask-image: url('/brush-stroke-wide.svg');
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      transform: rotate(-2deg);
    }
    .brush-text {
      position: absolute;
      top: 78px;
      left: 80px;
      width: 380px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(-2deg);
      color: #ffffff;
      letter-spacing: 0.32em;
      font-size: 18px;
      text-transform: uppercase;
    }

    /* Giant outline crown watermark — drifting position */
    .crown-watermark {
      position: absolute;
      top: -40px;
      left: 600px;
      width: 700px;
      height: auto;
      color: rgba(255,255,255,0.04);
      transform: rotate(2deg);
    }

    /* Headline */
    .headline {
      position: absolute;
      top: 175px;
      left: 80px;
      font-size: 180px;
      line-height: 0.85;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      color: #ffffff;
    }
    .headline .red { color: #C90012; }

    /* Tagline */
    .tagline {
      position: absolute;
      top: 460px;
      left: 80px;
      font-family: 'Permanent Marker', cursive;
      font-size: 56px;
      color: #F2A33A;
      letter-spacing: 0.02em;
    }
    .tagline .red { color: #C90012; }
    .tagline .muted { color: rgba(255,255,255,0.3); padding: 0 14px; }

    /* Right-side hero image */
    .hero-img {
      position: absolute;
      top: 0;
      right: -40px;
      width: 600px;
      height: 630px;
      overflow: hidden;
    }
    .hero-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .hero-img::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #050505 0%, transparent 25%, transparent 75%, rgba(5,5,5,0.4) 100%);
    }

    /* Crown badge top-right */
    .crown-badge {
      position: absolute;
      top: 56px;
      right: 80px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #C90012;
    }
    .crown-badge svg { width: 40px; height: 40px; }
    .crown-badge .label {
      color: rgba(255,255,255,0.6);
      font-family: 'Anton', sans-serif;
      font-size: 14px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }

    /* Star divider */
    .stars {
      position: absolute;
      top: 535px;
      left: 80px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255,255,255,0.6);
    }
    .stars .line { width: 48px; height: 1px; background: rgba(255,255,255,0.3); }
    .stars .star { font-size: 18px; }
    .stars .star.mid { color: #C90012; }
    .stars .crown-mini {
      width: 14px;
      height: 14px;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <!-- Right hero image -->
  <div class="hero-img">
    <img src="/food/hero-chicken.png" alt="" />
  </div>

  <!-- Crown watermark -->
  <svg class="crown-watermark" viewBox="0 0 100 80" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round">
    <path d="M6 22 L24 36 L34 8 L42 28 L50 4 L58 28 L66 8 L76 36 L94 22 L86 70 L14 70 Z" />
    <rect x="14" y="70" width="72" height="6" />
  </svg>

  <!-- Brush stroke label -->
  <div class="brush"></div>
  <div class="brush-text">The Royal Crunch</div>

  <!-- Headline -->
  <div class="headline">
    Crown<br />
    Fried <span class="red">Chicken</span>
  </div>

  <!-- Tagline -->
  <div class="tagline">
    Crispy <span class="muted">·</span> Juicy <span class="muted">·</span> <span class="red">Royal</span>
  </div>

  <!-- Crown badge -->
  <div class="crown-badge">
    <svg viewBox="0 0 100 80" fill="currentColor" aria-hidden="true">
      <path d="M6 22 L24 36 L34 8 L42 28 L50 4 L58 28 L66 8 L76 36 L94 22 L86 70 L14 70 Z" />
      <circle cx="50" cy="22" r="3.4" fill="#050505" />
      <circle cx="26" cy="50" r="3.2" fill="#050505" />
      <circle cx="74" cy="50" r="3.2" fill="#050505" />
      <rect x="14" y="70" width="72" height="6" />
    </svg>
    <span class="label">Crown · Brooklyn</span>
  </div>

  <!-- Star divider -->
  <div class="stars">
    <span class="line"></span>
    <span class="star">★</span>
    <span class="star mid">★</span>
    <span class="star">★</span>
    <span class="line"></span>
  </div>
</body>
</html>
